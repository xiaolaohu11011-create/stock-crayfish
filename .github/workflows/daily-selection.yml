name: 选股小龙虾 - 综合选股(09:45)

on:
  schedule:
    # 周一到周五，北京时间 09:45（UTC 01:45）
    - cron: '45 1 * * 1-5'
  workflow_dispatch:
    inputs:
      mock:
        description: '使用模拟数据测试'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  stock-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行综合选股
        run: |
          if [ "${{ github.event.inputs.mock }}" = "true" ]; then
            python main.py --mode selection --mock
          else
            python main.py --mode selection
          fi
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PYTHONIOENCODING: utf-8

      - name: 上传选股报告
        uses: actions/upload-artifact@v4
        with:
          name: stock-report-selection-${{ github.run_number }}
          path: output/
          retention-days: 30
